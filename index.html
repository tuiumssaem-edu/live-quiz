<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장애인식개선 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body { font-size: 17px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .brand { font-family: var(--display); font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .brand b { color: var(--coral); font-weight: 400; }
  .me { font-family: var(--body); font-size: .9rem; font-weight: 700; background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hero { display: grid; gap: 14px; text-align: center; padding: 26px 20px; }
  .hero h1 { font-size: 2rem; }
  .field { display: grid; gap: 6px; text-align: left; }
  .field label { font-weight: 700; font-size: .95rem; }
  .err { color: #B23A26; font-weight: 700; min-height: 1.4em; }
  .big-emoji { font-size: 4.2rem; line-height: 1; }
  .qmeta { display: flex; align-items: center; gap: 8px; }
  .qmeta .qno { font-family: var(--display); font-size: 1.2rem; }
  .tbar { height: 10px; background: rgba(31,45,90,.1); border-radius: 10px; overflow: hidden; }
  .tbar div { height: 100%; background: var(--coral); width: 100%; }
  .qtext { font-family: var(--display); font-size: 1.45rem; line-height: 1.4; }
  .hint { font-family: var(--display); font-size: 2.6rem; letter-spacing: .12em; color: var(--coral); text-align: center; }
  .choices { display: grid; gap: 10px; }
  .choice {
    background: var(--c); color: #fff; border-radius: 18px; padding: 16px 18px; min-height: 64px;
    display: flex; align-items: center; gap: 12px; text-align: left; font-family: var(--display); font-size: 1.25rem;
    box-shadow: 0 4px 0 rgba(0,0,0,.18);
  }
  .choice:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .ox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ox .choice { justify-content: center; font-size: 4rem; min-height: 150px; }
  .order-pick { display: grid; gap: 10px; }
  .order-pick button {
    background: var(--card); color: var(--ink); border: 2px solid var(--line); border-radius: 16px; padding: 14px 16px;
    display: flex; gap: 12px; align-items: center; text-align: left; font-family: var(--display); font-size: 1.15rem;
  }
  .order-pick button .badge { width: 1.8em; height: 1.8em; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; flex: none; }
  .order-pick button.on { border-color: var(--mint); background: var(--mint-soft); }
  .order-pick button.on .badge { background: var(--mint); border: 0; color: #fff; }
  .countdown { font-family: var(--display); font-size: 8rem; text-align: center; color: var(--coral); line-height: 1; }
  .result { display: grid; gap: 10px; text-align: center; padding: 30px 20px; border-radius: 24px; color: #fff; }
  .result.ok { background: var(--mint); }
  .result.no { background: var(--coral); }
  .result.none { background: var(--ink-soft); }
  .result .display { font-size: 2.2rem; }
  .result .pts { font-family: var(--display); font-size: 1.6rem; }
  .stand { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stand .card { text-align: center; padding: 14px; }
  .stand .v { font-family: var(--display); font-size: 1.8rem; font-variant-numeric: tabular-nums; }
  .ex img { width: 100%; border-radius: 16px; border: 2px solid var(--line); background: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span>장애인식개선 <b>퀴즈</b></span><span class="me" id="meTag" hidden></span></div>

  <section id="setup" data-screen hidden>
    <div class="card hero"><h1>준비 중이에요</h1><p class="muted">진행자가 아직 퀴즈 연결을 마치지 않았어요.</p></div>
  </section>

  <section id="join" data-screen hidden>
    <form class="card hero" id="joinForm" novalidate>
      <span class="label" style="justify-self:center">퀴즈 입장</span>
      <h1>닉네임을 정해 주세요</h1>
      <div class="field"><label for="pinIn">PIN 번호</label><input id="pinIn" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="6자리 숫자"></div>
      <div class="field"><label for="nameIn">닉네임</label><input id="nameIn" autocomplete="off" maxlength="12" placeholder="최대 12자"></div>
      <div class="err" id="joinErr" role="alert"></div>
      <button class="btn coral" type="submit" id="joinBtn">입장하기</button>
    </form>
  </section>

  <section id="wait" data-screen hidden>
    <div class="card hero">
      <div class="big-emoji" aria-hidden="true">🙌</div>
      <h1 id="waitTitle">입장 완료!</h1>
      <p class="muted" id="waitMsg">진행자가 시작하면 이 화면에 문제가 나와요.</p>
    </div>
  </section>

  <section id="q" data-screen hidden>
    <div class="qmeta"><span class="qno" id="qNo"></span><span class="label" id="qType"></span><span class="double-badge" id="qDouble" hidden>점수 2배!</span></div>
    <div class="tbar"><div id="tFill"></div></div>
    <div id="qCount" class="countdown" hidden></div>
    <div id="qMain">
      <div class="qtext" id="qText"></div>
      <div id="qBody" style="margin-top:16px"></div>
    </div>
  </section>

  <section id="sent" data-screen hidden>
    <div class="card hero">
      <div class="big-emoji" aria-hidden="true">📨</div>
      <h1 id="sentTitle">답을 보냈어요</h1>
      <p class="muted" id="sentAns"></p>
      <p class="muted">다른 분들을 기다리는 중이에요.</p>
    </div>
  </section>

  <section id="result" data-screen hidden>
    <div class="result" id="resBox">
      <div class="display" id="resTitle"></div>
      <div class="pts" id="resPts"></div>
    </div>
    <div class="card" style="text-align:center"><div class="muted" style="font-weight:700">정답</div><div class="display" style="font-size:1.3rem" id="resAnswer"></div></div>
    <div class="stand">
      <div class="card"><div class="muted">지금 순위</div><div class="v" id="resRank"></div></div>
      <div class="card"><div class="muted">총점</div><div class="v" id="resScore"></div></div>
    </div>
  </section>

  <section id="ex" data-screen hidden>
    <div class="card ex" style="display:grid;gap:12px">
      <span class="label" style="justify-self:start">함께 보기</span>
      <h2 style="font-size:1.5rem;line-height:1.35" id="exTitle"></h2>
      <img id="exImg" alt="">
      <p id="exComment" class="muted" style="margin:0"></p>
    </div>
  </section>

  <section id="final" data-screen hidden>
    <div class="card hero">
      <div class="big-emoji" id="finEmoji" aria-hidden="true"></div>
      <h1 id="finTitle"></h1>
      <p class="muted" id="finMsg"></p>
    </div>
    <div class="stand">
      <div class="card"><div class="muted">최종 순위</div><div class="v" id="finRank"></div></div>
      <div class="card"><div class="muted">총점</div><div class="v" id="finScore"></div></div>
    </div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="quiz.js"></script>
<script src="common.js"></script>
<script src="play.js"></script>
</body>
</html>
