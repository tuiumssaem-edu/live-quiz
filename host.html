<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장애인식개선 퀴즈 · 진행자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  body { font-size: clamp(16px, 1.25vw, 22px); }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { font-family: var(--display); font-size: 1.3rem; }
  .brand b { color: var(--coral); font-weight: 400; }

  /* 시작 */
  #start .card { max-width: 640px; margin: 6vh auto 0; display: grid; gap: 18px; text-align: center; padding: 36px 28px; }
  #start h1 { font-size: clamp(2rem, 4vw, 3rem); }

  /* 대기실 */
  .lobby { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 24px; align-items: start; }
  @media (max-width: 820px) { .lobby { grid-template-columns: 1fr; } }
  .join-card { display: grid; gap: 14px; justify-items: center; text-align: center; }
  #qr { background: #fff; padding: 14px; border-radius: 18px; border: 2px solid var(--line); }
  #qr img, #qr canvas { display: block; width: min(320px, 70vw) !important; height: auto !important; }
  .pin { font-family: var(--display); font-size: clamp(2.6rem, 6vw, 4.4rem); letter-spacing: .12em; line-height: 1; }
  .url { font-size: .9rem; word-break: break-all; color: var(--ink-soft); }
  .people-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .people-head .n { font-family: var(--display); font-size: 2.4rem; color: var(--coral); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px;
    font-weight: 700; animation: pop .3s ease-out; display: inline-flex; gap: 6px; align-items: center;
  }
  .chip button { background: none; color: var(--ink-soft); padding: 0 2px; font-size: 1rem; line-height: 1; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* 문제 */
  .qhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .qno { font-family: var(--display); font-size: 1.4rem; }
  .timer {
    margin-left: auto; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--display); font-size: 2.2rem; color: #fff; background: conic-gradient(var(--coral) var(--p, 100%), var(--ink) 0);
    font-variant-numeric: tabular-nums;
  }
  .timer span { width: 66px; height: 66px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
  .answered { font-family: var(--display); font-size: 1.3rem; }
  .answered b { color: var(--coral); font-weight: 400; font-size: 1.8rem; }
  .qtext { font-family: var(--display); font-size: clamp(1.8rem, 3.4vw, 3rem); line-height: 1.35; }
  .hint { font-family: var(--display); font-size: clamp(3rem, 8vw, 6rem); letter-spacing: .14em; color: var(--coral); text-align: center; }
  .opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .opt {
    background: var(--c); color: #fff; border-radius: 20px; padding: 22px 24px; min-height: 96px;
    display: flex; align-items: center; gap: 16px; font-family: var(--display); font-size: clamp(1.4rem, 2.4vw, 2.1rem);
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
  }
  .opt.big { justify-content: center; font-size: clamp(4rem, 9vw, 7rem); min-height: 180px; }
  .opt.dim { opacity: .3; }
  .opt.right { outline: 6px solid var(--ink); outline-offset: 4px; }
  .order-items { display: grid; gap: 10px; }
  .order-items div { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 16px 20px; font-family: var(--display); font-size: clamp(1.3rem, 2.2vw, 1.8rem); }
  .count-over {
    position: fixed; inset: 0; display: grid; place-items: center; background: rgba(31,45,90,.92); color: #fff; z-index: 5;
    font-family: var(--display); text-align: center;
  }
  .count-over .n { font-size: 30vmin; line-height: 1; animation: pop .5s ease-out; }

  /* 정답 공개 */
  .reveal-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 900px) { .reveal-grid { grid-template-columns: 1fr; } }
  .answer-box { background: var(--mint); color: #fff; border-radius: 20px; padding: 22px 26px; }
  .answer-box .display { font-size: clamp(1.8rem, 3.4vw, 2.8rem); }
  .bars { display: grid; gap: 10px; }
  .bar { display: grid; grid-template-columns: minmax(0, 12em) 1fr 3em; align-items: center; gap: 10px; font-weight: 700; }
  .bar .track { background: rgba(31,45,90,.08); border-radius: 10px; height: 34px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--c); width: 0; transition: width .8s ease-out; border-radius: 10px; }
  .bar .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar.ok .nm::after { content: " ✓"; color: var(--mint); }
  .stat-big { font-family: var(--display); font-size: 1.5rem; }

  /* 설명 */
  .ex { display: grid; gap: 20px; justify-items: center; text-align: center; }
  .ex h2 { font-size: clamp(2rem, 3.8vw, 3.2rem); line-height: 1.3; }
  .ex img { width: min(900px, 100%); border-radius: 20px; border: 2px solid var(--line); background: #fff; }
  .ex p { font-size: clamp(1.1rem, 1.8vw, 1.5rem); margin: 0; max-width: 60ch; }

  /* 최종 */
  .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: end; max-width: 900px; margin: 0 auto; width: 100%; }
  .pod { text-align: center; display: grid; gap: 8px; }
  .pod .nm { font-family: var(--display); font-size: clamp(1.3rem, 2.6vw, 2.2rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pod .block { border-radius: 18px 18px 0 0; color: #fff; font-family: var(--display); display: grid; place-items: center; font-size: 3rem; animation: rise .9s ease-out both; }
  .pod.p1 .block { background: var(--coral); height: 230px; animation-delay: .9s; }
  .pod.p2 .block { background: var(--mint); height: 170px; animation-delay: .5s; }
  .pod.p3 .block { background: var(--sky); height: 120px; animation-delay: .1s; }
  .pod .sc { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-weight: 700; }
  @keyframes rise { from { transform: scaleY(0); transform-origin: bottom; } to { transform: scaleY(1); transform-origin: bottom; } }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">장애인식개선 <b>퀴즈</b></div>
    <span class="label" id="roomLabel" hidden></span>
  </header>

  <!-- Firebase 미설정 -->
  <section id="setup" data-screen hidden>
    <div class="card">
      <h2>Firebase 연결이 필요해요</h2>
      <p class="muted">config.js 파일에 firebaseConfig 값을 붙여 넣으면 퀴즈를 열 수 있습니다.</p>
    </div>
  </section>

  <!-- 시작 -->
  <section id="start" data-screen hidden>
    <div class="card">
      <span class="label">진행자 화면</span>
      <h1 id="quizTitle"></h1>
      <p class="muted" id="quizInfo"></p>
      <div class="row" style="justify-content:center">
        <button class="btn coral" id="createBtn">새 퀴즈 방 열기</button>
        <button class="btn ghost" id="resumeBtn" hidden></button>
      </div>
    </div>
  </section>

  <!-- 대기실 -->
  <section id="lobby" data-screen hidden>
    <div class="lobby">
      <div class="card join-card">
        <span class="label">휴대폰 카메라로 QR을 찍어 들어오세요</span>
        <div id="qr"></div>
        <div class="muted">PIN 번호</div>
        <div class="pin" id="pinText"></div>
        <div class="url" id="joinUrl"></div>
      </div>
      <div class="card">
        <div class="people-head"><span class="n" id="pCount">0</span><span class="display" style="font-size:1.4rem">명 입장</span></div>
        <div class="chips" id="chips"><span class="muted">아직 아무도 없어요. QR을 찍고 닉네임을 입력하면 여기에 이름이 보여요.</span></div>
        <p class="muted" style="margin-top:14px;font-size:.9rem">이름 옆 × 를 누르면 그 참가자를 내보냅니다.</p>
        <div class="actions" style="margin-top:16px">
          <button class="btn coral" id="startBtn">퀴즈 시작</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 문제 -->
  <section id="question" data-screen hidden>
    <div class="qhead">
      <span class="qno" id="qNo"></span>
      <span class="label" id="qType"></span>
      <span class="double-badge" id="qDouble" hidden>점수 2배!</span>
      <span class="answered"><b id="ansCount">0</b> / <span id="ansTotal">0</span> 명 제출</span>
      <div class="timer" id="timer"><span id="timerNum"></span></div>
    </div>
    <div class="qtext" id="qText"></div>
    <div id="qBody"></div>
    <div class="actions"><button class="btn ghost" id="revealNow">바로 정답 공개</button></div>
    <div class="count-over" id="countOver" hidden><div><div style="font-size:5vmin" id="countLabel"></div><div class="double-badge" id="countDouble" style="font-size:4vmin;margin-top:2vmin" hidden>점수 2배 찬스!</div><div class="n" id="countNum"></div></div></div>
  </section>

  <!-- 정답 공개 -->
  <section id="reveal" data-screen hidden>
    <div class="qhead"><span class="qno" id="rNo"></span><span class="label coral">정답 공개</span></div>
    <div class="reveal-grid">
      <div style="display:grid;gap:16px">
        <div class="answer-box"><div style="opacity:.85;font-weight:700">정답</div><div class="display" id="rAnswer"></div></div>
        <div class="card">
          <div class="stat-big" id="rStat"></div>
          <div class="bars" id="rBars" style="margin-top:14px"></div>
        </div>
      </div>
      <div class="card">
        <h3 style="font-size:1.5rem;margin-bottom:12px">지금 순위</h3>
        <ol class="rank-list" id="rTop"></ol>
      </div>
    </div>
    <div class="actions">
      <button class="btn mint" id="toExplain">설명 보기</button>
      <button class="btn coral" id="rNext"></button>
    </div>
  </section>

  <!-- 설명 -->
  <section id="explain" data-screen hidden>
    <div class="ex">
      <h2 id="exTitle"></h2>
      <img id="exImg" alt="">
      <p id="exComment"></p>
    </div>
    <div class="actions"><button class="btn coral" id="exNext"></button></div>
  </section>

  <!-- 최종 결과 -->
  <section id="final" data-screen hidden>
    <h1 class="center" style="font-size:clamp(2.2rem,5vw,3.6rem)">최종 순위</h1>
    <div class="podium" id="podium"></div>
    <div class="card" style="max-width:900px;margin:0 auto;width:100%">
      <ol class="rank-list" id="allRank"></ol>
    </div>
    <div class="actions" style="max-width:900px;margin:0 auto;width:100%">
      <button class="btn ghost" id="newRoom">새 방 열기</button>
      <button class="btn" id="closeRoom">방 데이터 지우기</button>
    </div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="quiz.js"></script>
<script src="common.js"></script>
<script src="host.js"></script>
</body>
</html>
